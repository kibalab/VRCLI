name: VPM Listing

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  LISTING_DIRECTORY: Website
  AUTOMATION_DIRECTORY: PackageListingAutomation
  PACKAGE_NAME: com.kibalab.vrcli

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out VPM listing automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vrchat-community/package-list-action
          ref: cb31c3b5d17d1070d7741c61de2ca1b219224039
          path: ${{ env.AUTOMATION_DIRECTORY }}
          clean: false

      - name: Restore listing cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ env.AUTOMATION_DIRECTORY }}/.nuke/temp
            ~/.nuget/packages
          key: vpm-listing-${{ runner.os }}-${{ hashFiles('PackageListingAutomation/**/*.csproj') }}

      - name: Build VPM listing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ${{ env.AUTOMATION_DIRECTORY }}/build.cmd BuildRepoListing
          --root ${{ env.AUTOMATION_DIRECTORY }}
          --list-publish-directory $GITHUB_WORKSPACE/${{ env.LISTING_DIRECTORY }}
          --current-package-name ${{ env.PACKAGE_NAME }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ env.LISTING_DIRECTORY }}

      - name: Deploy VPM listing
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
